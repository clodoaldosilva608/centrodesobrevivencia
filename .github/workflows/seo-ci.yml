name: SEO & Lighthouse

# Re-validates SEO tags + Lighthouse scores after every publish so route or
# sitemap changes can't silently break performance / accessibility.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Published URL to audit (defaults to centrodesobrevivencia.lovable.app)"
        required: false
        default: "https://centrodesobrevivencia.lovable.app"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (also regenerates sitemap via prebuild hook)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Validate canonical / og:url / og:image on every sitemap route
        id: seo
        # Continue so we can ALWAYS upload the report, then enforce below.
        continue-on-error: true
        run: bunx tsx scripts/validate-seo.ts

      - name: Upload SEO validation report (HTML + JSON, per-route failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-validation-report
          path: seo-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Render report summary into PR / job summary
        if: always()
        run: |
          if [ -f seo-report/report.json ]; then
            echo "## SEO Validation" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./seo-report/report.json');
              const s = r.summary;
              console.log('- **Total:** ' + s.total + ' — passed: ' + s.passed + ', failed: ' + s.failed + ' (concurrency=' + s.concurrency + ')');
              console.log('');
              console.log('### Failure rate by category');
              console.log('| Category | Routes failing | Failure % |');
              console.log('|---|---|---|');
              for (const c of s.categoryStats) console.log('| \`' + c.category + '\` | ' + c.failedRoutes + ' / ' + c.total + ' | ' + c.failurePct + '% |');
              console.log('');
              if (s.ranking.length) {
                console.log('### Top failing routes');
                console.log('| # | Route | Issues | Codes |');
                console.log('|---|---|---|---|');
                s.ranking.forEach((x, i) => console.log('| ' + (i+1) + ' | \`' + x.route + '\` | ' + x.issues + ' | \`' + x.codes.join(', ') + '\` |'));
                console.log('');
              }
              const failed = r.results.filter(x => !x.ok);
              if (failed.length) {
                console.log('### Per-route failures');
                console.log('| Route | Issue | Detail | Artifacts |');
                console.log('|---|---|---|---|');
                for (const f of failed) for (const i of f.issues) {
                  const a = f.artifacts ? '[html](' + f.artifacts.html + ') · [png](' + f.artifacts.screenshot + ')' : '—';
                  console.log('| \`' + f.route + '\` | \`' + i.code + '\` | ' + i.message.replace(/\|/g,'\\\\|') + ' | ' + a + ' |');
                }
              } else {
                console.log('All routes passed.');
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail job if validate-seo reported issues
        if: steps.seo.outcome == 'failure'
        run: |
          echo "validate-seo failed — see uploaded artifact 'seo-validation-report' for the full per-route HTML/JSON report."
          exit 1

      - name: Lighthouse CI on the live published site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.target_url || 'https://centrodesobrevivencia.lovable.app' }}
            ${{ github.event.inputs.target_url || 'https://centrodesobrevivencia.lovable.app' }}/equipamentos
            ${{ github.event.inputs.target_url || 'https://centrodesobrevivencia.lovable.app' }}/ebooks
            ${{ github.event.inputs.target_url || 'https://centrodesobrevivencia.lovable.app' }}/jogos
            ${{ github.event.inputs.target_url || 'https://centrodesobrevivencia.lovable.app' }}/bussola
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
