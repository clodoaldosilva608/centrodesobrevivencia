<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survival Hub - Offline</title>
  <meta name="theme-color" content="#e87b1e" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141916;
      color: #e8e4dc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo-container {
      width: 120px; height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, #e87b1e, #c45e0a);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(232,123,30,0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(232,123,30,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(232,123,30,0.5); }
    }
    .logo-container img { width: 80px; height: 80px; }
    h1 {
      font-size: 1.75rem; font-weight: 800;
      background: linear-gradient(135deg, #e87b1e, #f5a623);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    p { color: #a09888; font-size: 1rem; line-height: 1.6; max-width: 360px; margin-bottom: 1.5rem; }
    .icon-offline {
      font-size: 3rem; margin-bottom: 1rem; opacity: 0.6;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .retry-btn {
      background: linear-gradient(135deg, #e87b1e, #c45e0a);
      color: #fff; border: none; padding: 0.875rem 2rem;
      border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,123,30,0.4); }
    .retry-btn:active { transform: translateY(0); }
    .tips { margin-top: 3rem; padding: 1.5rem; background: rgba(232,123,30,0.08); border-radius: 16px; border: 1px solid rgba(232,123,30,0.15); max-width: 360px; }
    .tips h3 { font-size: 0.875rem; color: #e87b1e; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .tips ul { list-style: none; text-align: left; }
    .tips li { padding: 0.375rem 0; font-size: 0.875rem; color: #a09888; }
    .tips li::before { content: "🔥 "; }
  </style>
</head>
<body>
  <div class="icon-offline">📡</div>
  <div class="logo-container">
    <img src="/icon-192.png" alt="Survival Hub" />
  </div>
  <h1>Sem Conexão</h1>
  <p>Você está offline no momento. Verifique sua conexão com a internet e tente novamente.</p>
  <button class="retry-btn" onclick="window.location.reload()">Tentar Novamente</button>
  <div class="tips">
    <h3>Dica de Sobrevivência</h3>
    <ul>
      <li>Sempre carregue um kit de primeiros socorros</li>
      <li>Água é prioridade número 1</li>
      <li>Sinalize sua posição em emergências</li>
    </ul>
  </div>
</body>
</html>
