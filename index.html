<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Sobrevivência — Hub de Bushcraft</title>
    <!--
      Metas por rota (canonical, og:*, twitter:*, description) são declaradas
      pelo componente <SEO> (react-helmet-async) em cada página — tags estáticas
      aqui duplicavam o head e o querySelector das ferramentas de raspagem
      pegava a versão da home em TODAS as rotas. O <title> e os blocos JSON-LD
      globais ficam como fallback antes do JS.
    -->
    <meta name="author" content="Centro de Sobrevivência" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6728" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Centro de Sobrevivência",
        "description": "Hub de bushcraft, sobrevivencialismo e aventura: equipamentos, e-books, simuladores, mapa interativo e bússola tática.",
        "inLanguage": "pt-BR"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Centro de Sobrevivência",
        "logo": "https://centrodesobrevivencia.vercel.app/icon-512.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
